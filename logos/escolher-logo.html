<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valora — Logos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
  :root{--bg:#FAF9F5;--card:#fff;--txt:#1F1E1D;--muted:#6F6E69;--line:#E6E3DA;--acc:#C96442}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:40px 24px 60px}
  header{max-width:1100px;margin:0 auto 28px}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:34px;margin:0 0 6px}
  header p{color:var(--muted);margin:0}
  .grade{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .topo{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .topo b{font-size:15px}
  .topo span{color:var(--muted);font-size:13px}
  .topo .num{color:#fff;font-size:13px}
  .num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:8px}
  .claro,.escuro{display:flex;align-items:center;justify-content:center;padding:34px 20px;min-height:150px}
  .claro{background:#fff;color:#1F1E1D}
  .escuro{background:#1F1E1D;color:#F5F4EE}
  .claro svg,.escuro svg{width:100%;max-width:360px;height:auto}
  .rod{display:flex;align-items:center;gap:18px;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .icones{display:flex;align-items:flex-end;gap:12px}
  .icones svg{display:block;border-radius:22%;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .rod p{flex:1;min-width:180px;margin:0;color:var(--muted);font-size:13px;line-height:1.5}
  .rod button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  .rod button:hover{border-color:var(--acc);color:var(--acc)}
  @media (max-width:560px){.grade{grid-template-columns:1fr}body{padding:24px 16px}}
</style>
</head>
<body>
<header>
  <h1>Valora — escolha o logo</h1>
  <p>4 opções, cada uma no fundo claro, no fundo escuro e como ícone do app (tamanhos de favicon e de celular).</p>
</header>
<div class="grade" id="grade"></div>

<script>
const TERRA = '#C96442', AMBAR = '#E0A458', ESCURO = '#1F1E1D';

/* ---------- Ícones (80x80) ---------- */
const ICONES = {
  // 1. V que vira um "check" de aprovado
  check: `
    <rect width="80" height="80" rx="20" fill="${TERRA}"/>
    <path d="M20 34 L36 58 L62 18" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`,
  // 2. Documento com V
  documento: `
    <rect x="0.75" y="0.75" width="78.5" height="78.5" rx="19.5" fill="${ESCURO}" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M24 14 H46 L58 26 V62 a4 4 0 0 1 -4 4 H24 a4 4 0 0 1 -4 -4 V18 a4 4 0 0 1 4 -4 Z" fill="#F5F4EE"/>
    <path d="M46 14 V26 H58 Z" fill="#D6D2C6"/>
    <path d="M28 34 L39 54 L50 34" fill="none" stroke="${TERRA}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
  // 3. Gema lapidada (valor)
  gema: `
    <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${AMBAR}"/><stop offset="1" stop-color="${TERRA}"/></linearGradient></defs>
    <rect width="80" height="80" rx="20" fill="url(#g3)"/>
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M26 20 H54 L66 34 L40 64 L14 34 Z"/>
      <path d="M14 34 H66"/>
      <path d="M26 20 L33 34 L40 20 L47 34 L54 20"/>
      <path d="M33 34 L40 64 L47 34"/>
    </g>`,
  // 4. Etiqueta de preço com V
  etiqueta: `
    <rect x="0.75" y="0.75" width="78.5" height="78.5" rx="19.5" fill="${ESCURO}" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M14 26 a6 6 0 0 1 6 -6 H48 L66 40 L48 60 H20 a6 6 0 0 1 -6 -6 Z" fill="${TERRA}"/>
    <circle cx="52" cy="40" r="4.5" fill="${ESCURO}"/>
    <path d="M23 31 L31 49 L39 31" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`
};

/* ---------- Logos completos (ícone + nome) ---------- */
const LOGOS = [
  { id:'check', nome:'Check de aprovação', estilo:'Serifado elegante',
    sobre:'O "V" de Valora vira um check de aprovado. Passa confiança e lembra "orçamento aprovado".',
    texto: `<text x="100" y="50" font-family="'Source Serif 4', Georgia, serif" font-size="44" font-weight="600" fill="currentColor" letter-spacing="-0.5">Valora</text>
            <text x="102" y="72" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="${TERRA}" letter-spacing="3.2">ORÇAMENTOS</text>` },
  { id:'documento', nome:'Documento', estilo:'Moderno, letra minúscula',
    sobre:'Uma folha de orçamento com o "V" em destaque. Deixa claro na hora o que o sistema faz.',
    texto: `<text x="100" y="54" font-family="Inter, sans-serif" font-size="42" font-weight="800" fill="currentColor" letter-spacing="-1.5">valora<tspan fill="${TERRA}">.</tspan></text>` },
  { id:'gema', nome:'Gema lapidada', estilo:'Premium, caixa alta',
    sobre:'Uma pedra preciosa: a ideia de "valor" do nome. É o mais sofisticado e premium dos quatro.',
    texto: `<text x="100" y="50" font-family="Inter, sans-serif" font-size="34" font-weight="600" fill="currentColor" letter-spacing="7">VALORA</text>
            <text x="102" y="70" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="currentColor" opacity=".6" letter-spacing="2">orçamentos premium</text>` },
  { id:'etiqueta', nome:'Etiqueta de preço', estilo:'Forte, comercial',
    sobre:'Uma etiqueta de preço com o "V". Comercial e direto, combina com loja, oficina e peças.',
    texto: `<text x="100" y="50" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="currentColor" letter-spacing="-1">Valora</text>
            <text x="102" y="70" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="currentColor" opacity=".6">orçamentos inteligentes</text>` }
];

const svgLogo = l => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Valora">${ICONES[l.id]}${l.texto}</svg>`;
const svgIcone = (id, t) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="${t}" height="${t}">${ICONES[id]}</svg>`;

const $grade = document.getElementById('grade');
$grade.innerHTML = LOGOS.map((l, i) => `
  <section class="card">
    <div class="topo"><b><span class="num">${i + 1}</span>${l.nome}</b><span>${l.estilo}</span></div>
    <div class="claro">${svgLogo(l)}</div>
    <div class="escuro">${svgLogo(l)}</div>
    <div class="rod">
      <div class="icones">${svgIcone(l.id, 64)}${svgIcone(l.id, 40)}${svgIcone(l.id, 20)}</div>
      <p>${l.sobre}</p>
      <button data-i="${i}">Baixar SVG</button>
    </div>
  </section>`).join('');

document.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
  const l = LOGOS[+b.dataset.i];
  const svg = svgLogo(l).replace(/currentColor/g, ESCURO);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
  a.download = `valora-logo-${b.dataset.i * 1 + 1}-${l.id}.svg`; a.click();
});
</script>
</body>
</html>
